version: 1
applications:
  - appRoot: apps/public-site
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - export NODE_OPTIONS=--max-old-space-size=6144
            - npm ci --omit=optional
        build:
          commands:
            - export NODE_OPTIONS=--max-old-space-size=6144
            - |
              set -euo pipefail
              : > apps/public-site/.env.production
              for name in \
                CONTACT_SUBMISSIONS_TABLE CONTACT_NOTIFICATION_TOPIC_ARN CONTACT_RATE_LIMIT_SALT_SECRET_ARN CONTACT_ALLOWED_HOSTS \
                ACCESS_REQUESTS_TABLE ACCESS_NOTIFICATION_TOPIC_ARN ACCESS_RATE_LIMIT_SALT_SECRET_ARN ACCESS_ALLOWED_ORIGINS \
                OPENAI_SECRET_ARN OPENAI_PLACE_EVIDENCE_SECRET_ARN VOICE_PROVIDER_ALIAS OPENAI_REALTIME_MODEL OPENAI_REALTIME_ENABLED OPENAI_GPT_LIVE_MODEL \
                PUBLICATION_ACCESS_TABLE PUBLICATION_ASSET_BUCKET PUBLICATION_EMAIL_FROM PUBLICATION_HASH_SALT_SECRET_ARN PUBLICATION_ALLOWED_HOSTS PUBLIC_SITE_URL \
                PARTNER_EVIDENCE_REVIEW_ENABLED EVIDENCE_DATABASE_CLUSTER_ARN EVIDENCE_DATABASE_SECRET_ARN EVIDENCE_DATABASE_NAME EVIDENCE_ALLOWED_HOSTS \
                EVIDENCE_RATE_LIMIT_TABLE EVIDENCE_RATE_LIMIT_SALT_SECRET_ARN OPENAI_PLACE_EVIDENCE_MODEL PLACE_EVIDENCE_PROVIDER EVIDENCE_SOURCE_CDC_PLACES_ENABLED \
                PLACE_AGENT_MAX_PER_NETWORK_HOUR PLACE_AGENT_MAX_GLOBAL_DAY PLACE_AGENT_RATE_LIMIT_NAMESPACE \
                WORKSPACE_EVENT_MAX_PER_MEMBER_HOUR WORKSPACE_EVENT_MAX_PER_WORKSPACE_DAY RUNTIME_ENV EVIDENCE_SNAPSHOT_CONTENT_HASH \
                EXPLORE_REALTIME_SESSION_TABLE EXPLORE_REALTIME_CONNECTION_TABLE EXPLORE_REALTIME_MANAGEMENT_ENDPOINT EXPLORE_REALTIME_PUBLIC_ENDPOINT; do
                if [[ -n "${!name:-}" ]]; then
                  printf '%s=%s\n' "$name" "${!name}" >> apps/public-site/.env.production
                fi
              done
            - npm run build:public
            - npm run verify:public-runtime-security
      artifacts:
        baseDirectory: apps/public-site/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/public-site/.next/cache/**/*
