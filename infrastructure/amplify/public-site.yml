version: 1
applications:
  - appRoot: apps/public-site
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - export NODE_OPTIONS=--max-old-space-size=6144
            - npm ci --omit=optional
        build:
          commands:
            - export NODE_OPTIONS=--max-old-space-size=6144
            - env | grep -E '^(EVIDENCE_|OPENAI_PLACE_EVIDENCE_|PLACE_EVIDENCE_|PLACE_AGENT_|EXPLORE_REALTIME_)' > apps/public-site/.env.production
            - npm run build:public
            - npm run verify:public-runtime-security
      artifacts:
        baseDirectory: apps/public-site/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/public-site/.next/cache/**/*
