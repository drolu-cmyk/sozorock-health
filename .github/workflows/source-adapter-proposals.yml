name: Propose approved-source changes

on:
  schedule:
    - cron: "17 7 * * 1"
    - cron: "43 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: explore-source-adapter-proposals
  cancel-in-progress: false

jobs:
  guarded-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --omit=optional
      - name: Validate official candidates without publishing
        run: |
          set -euo pipefail
          npm run build:national-acs-context --workspace @sozorock/evidence-core
          npm run build:national-hrsa-context --workspace @sozorock/evidence-core
          npm run build:national-ahrf-context --workspace @sozorock/evidence-core
          npm run build:national-ahrq-context --workspace @sozorock/evidence-core
          npm run build:national-coverage --workspace @sozorock/evidence-core
          npm run test --workspace @sozorock/evidence-core
      - name: Create a guarded review pull request only when artifacts change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No approved source artifact changed."
            exit 0
          fi
          branch="automation/source-adapter-review-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          mkdir -p output/source-adapter-review
          git diff --stat > output/source-adapter-review/change-stat.txt
          cat > output/source-adapter-review/README.md <<'EOF'
          # Guarded source-adapter review

          This branch was created by the scheduled source-maintenance check. The candidate source changed a governed artifact. The pull request is **not** an automatic publication. A reviewer must validate source meaning, release date, data period, geography, directionality, checksum and coverage before merging.

          Failed retrievals remain failed; the last approved snapshot stays active.
          EOF
          git add packages/evidence-core/data output/source-adapter-review
          git commit -m "chore(explore): propose governed source adapter update"
          git push origin HEAD:"$branch"
          gh pr create --base main --head "$branch" \
            --title "[Evidence review] governed source adapter candidate" \
            --body-file output/source-adapter-review/README.md
