name: Production Deploy status bridge

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Record production Deploy result
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      GH_STATUS_TOKEN: ${{ github.token }}
    steps:
      - name: Publish upstream Deploy status
        shell: bash
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID"
          if [[ "$UPSTREAM_CONCLUSION" == "success" ]]; then
            state=success
            description='Production Deploy completed successfully'
          else
            state=failure
            description="Production Deploy failed closed: $UPSTREAM_CONCLUSION"
          fi
          payload=$(jq -cn \
            --arg state "$state" \
            --arg target_url "$target_url" \
            --arg description "$description" \
            --arg context 'deploy/production' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_STATUS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null
