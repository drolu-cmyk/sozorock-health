name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: amplify-d307qqji18y8il-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Verify the release source
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          origin_main_before=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          test -n "$origin_main_before"
          test "$origin_main_before" = "$release_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          npm ci --omit=optional
          npm run typecheck
          npm run lint
          npm test
          if find apps/public-site/public/publications -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Publication PDFs must be delivered from the private publication bucket."
            exit 1
          fi
          npm run build:public
          npm run verify:public-runtime-security
          npm run build:platform
          npm audit --omit=dev --omit=optional --audit-level=moderate
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy public site
        env:
          PUBLIC_APP_ID: ${{ vars.PUBLIC_AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH_NAME || 'main' }}
          CONTACT_EMAIL: contact@sozorockfoundation.org
          OPENAI_SECRET_ARN: ${{ secrets.OPENAI_SECRET_ARN }}
          VOICE_PROVIDER_ALIAS: ${{ vars.VOICE_PROVIDER_ALIAS || 'gpt-live' }}
          OPENAI_REALTIME_MODEL: ${{ vars.OPENAI_REALTIME_MODEL || 'gpt-realtime-2.1' }}
          OPENAI_REALTIME_ENABLED: ${{ vars.OPENAI_REALTIME_ENABLED || 'false' }}
          OPENAI_GPT_LIVE_MODEL: ${{ vars.OPENAI_GPT_LIVE_MODEL }}
          PUBLICATION_HASH_SALT: ${{ secrets.PUBLICATION_HASH_SALT }}
          SES_IDENTITY_ARN: ${{ vars.SES_IDENTITY_ARN }}
          PUBLICATION_EMAIL_FROM: ${{ vars.PUBLICATION_EMAIL_FROM || 'publications@sozorockfoundation.org' }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://health.sozorockfoundation.org' }}
          ACCESS_ALLOWED_ORIGINS: ${{ vars.ACCESS_ALLOWED_ORIGINS || 'https://health.sozorockfoundation.org;https://www.health.sozorockfoundation.org' }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_APP_ID"
          test -n "$OPENAI_SECRET_ARN"
          test -n "$PUBLICATION_HASH_SALT"
          test -n "$SES_IDENTITY_ARN"

          # Email verification is the authorization gate for publication access.
          # A production release must therefore prove that SES is allowed to send
          # to ordinary public mailboxes before the request flow is published.
          ses_account=$(aws sesv2 get-account --region "${AWS_REGION:-us-east-1}" --output json)
          ses_production_access=$(jq -r '.ProductionAccessEnabled // false' <<<"$ses_account")
          if [[ "$ses_production_access" != "true" ]]; then
            echo "Amazon SES production access is not enabled in ${AWS_REGION:-us-east-1}; submitting a transactional production-access request."
            aws sesv2 put-account-details \
              --region "${AWS_REGION:-us-east-1}" \
              --mail-type TRANSACTIONAL \
              --website-url "$PUBLIC_SITE_URL" \
              --contact-language EN \
              --additional-contact-email-addresses "$CONTACT_EMAIL" \
              --use-case-description "SozoRock Health sends low-volume transactional verification emails only after a visitor requests a Foundation publication. Verification is required before a secure publication access session is created. Each verification link is single use and expires after 30 minutes. Marketing updates are separate and optional." \
              --production-access-enabled || true
            ses_account=$(aws sesv2 get-account --region "${AWS_REGION:-us-east-1}" --output json)
            ses_production_access=$(jq -r '.ProductionAccessEnabled // false' <<<"$ses_account")
          fi
          if [[ "$ses_production_access" != "true" ]]; then
            echo "Amazon SES production access remains unavailable; refusing to release a publication flow that requires email verification."
            exit 1
          fi
          ses_sending_enabled=$(jq -r '.SendingEnabled // false' <<<"$ses_account")
          if [[ "$ses_sending_enabled" != "true" ]]; then
            echo "Amazon SES sending is disabled; refusing to release a publication flow that requires email verification."
            exit 1
          fi
          ses_delivery_ready=true
          echo "SES_DELIVERY_READY=true" >> "$GITHUB_ENV"

          if find apps/public-site/public/publications -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Publication PDFs must never be stored beneath the public web root."
            exit 1
          fi

          # `cloudformation deploy` performs template validation while creating
          # the change set. Keep the release role limited to the deploy actions
          # it is authorized to use; a separate ValidateTemplate API call is
          # redundant and is not granted to the production role.

          print_stack_failures() {
            local stack_name="$1"
            aws cloudformation describe-stack-events \
              --stack-name "$stack_name" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED' || ResourceStatus=='ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table 2>/dev/null \
              | sed -E 's/[0-9]{12}/[account]/g' \
              || true
          }

          deploy_stack() {
            local stack_name="$1"
            shift
            if ! aws cloudformation deploy --stack-name "$stack_name" "$@"; then
              echo "CloudFormation deployment failed for $stack_name."
              print_stack_failures "$stack_name"
              return 1
            fi
          }

          deploy_stack sozorock-health-contact \
            --template-file infrastructure/cloudformation/contact-backend.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              AmplifyAppId="$PUBLIC_APP_ID" \
              AmplifyBranchName="$AMPLIFY_BRANCH" \
              ContactEmail="$CONTACT_EMAIL" \
              OpenAISecretArn="$OPENAI_SECRET_ARN"

          deploy_stack sozorock-health-publication-access \
            --template-file infrastructure/cloudformation/publication-access.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              PublicationEmailFrom="$PUBLICATION_EMAIL_FROM" \
              SesIdentityArn="$SES_IDENTITY_ARN" \
              HashSalt="$PUBLICATION_HASH_SALT"

          contact_table=$(aws cloudformation describe-stacks --stack-name sozorock-health-contact --query "Stacks[0].Outputs[?OutputKey=='ContactTableName'].OutputValue" --output text)
          contact_topic=$(aws cloudformation describe-stacks --stack-name sozorock-health-contact --query "Stacks[0].Outputs[?OutputKey=='ContactTopicArn'].OutputValue" --output text)
          contact_salt_arn=$(aws cloudformation describe-stacks --stack-name sozorock-health-contact --query "Stacks[0].Outputs[?OutputKey=='ContactRateLimitSaltSecretArn'].OutputValue" --output text)
          public_compute_role=$(aws cloudformation describe-stacks --stack-name sozorock-health-contact --query "Stacks[0].Outputs[?OutputKey=='ComputeRoleArn'].OutputValue" --output text)
          access_table=$(aws cloudformation describe-stacks --stack-name sozorock-health-contact --query "Stacks[0].Outputs[?OutputKey=='AccessRequestTableName'].OutputValue" --output text)
          access_salt_arn=$(aws cloudformation describe-stacks --stack-name sozorock-health-contact --query "Stacks[0].Outputs[?OutputKey=='AccessRateLimitSaltSecretArn'].OutputValue" --output text)
          publication_table=$(aws cloudformation describe-stacks --stack-name sozorock-health-publication-access --query "Stacks[0].Outputs[?OutputKey=='PublicationAccessTableName'].OutputValue" --output text)
          publication_bucket=$(aws cloudformation describe-stacks --stack-name sozorock-health-publication-access --query "Stacks[0].Outputs[?OutputKey=='PublicationAssetBucketName'].OutputValue" --output text)
          publication_salt_arn=$(aws cloudformation describe-stacks --stack-name sozorock-health-publication-access --query "Stacks[0].Outputs[?OutputKey=='PublicationHashSaltSecretArn'].OutputValue" --output text)
          test -n "$publication_table"
          test -n "$publication_bucket"
          test -n "$publication_salt_arn"
          publication_intelligence_index_status=$(aws dynamodb describe-table \
            --table-name "$publication_table" \
            --query "Table.GlobalSecondaryIndexes[?IndexName=='PublicationIntelligence'].IndexStatus | [0]" \
            --output text)
          test "$publication_intelligence_index_status" = "ACTIVE"

          # Verify the policy that the Amplify SSR compute role will actually
          # use. CloudFormation can report the stack as healthy while a role
          # or inline-policy attachment is still wrong, so fail before release
          # rather than publishing a site whose access flow cannot reach AWS.
          public_compute_role_name="${public_compute_role##*/}"
          runtime_policy_response=$(aws iam get-role-policy \
            --role-name "$public_compute_role_name" \
            --policy-name SozoRockHealthPublicationAccess \
            --output json)
          runtime_policy=$(python3 -c 'import json, sys, urllib.parse; value = json.load(sys.stdin)["PolicyDocument"]; print(urllib.parse.unquote(value) if isinstance(value, str) else json.dumps(value))' <<<"$runtime_policy_response")
          jq -e '
            def actions: if (.Action | type) == "array" then .Action else [.Action] end;
            ([.Statement[] | select(.Sid == "PublicationRecords") | actions[]] | sort) as $records
            | (["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:TransactWriteItems"] - $records | length) == 0
            and ([.Statement[] | select(.Sid == "PublicationIntelligenceQuery") | actions[]] | index("dynamodb:Query")) != null
            and ([.Statement[] | select(.Sid == "ReadHashSalt") | actions[]] | index("secretsmanager:GetSecretValue")) != null
            and ([.Statement[] | select(.Sid == "ControlledPublicationRead") | actions[]] | index("s3:GetObject")) != null
            and ([.Statement[] | select(.Sid == "VerificationEmail") | actions[]] | index("ses:SendEmail")) != null
            and ([.Statement[] | select(.Sid == "VerificationEmail") | actions[]] | index("ses:SendRawEmail")) != null
          ' <<<"$runtime_policy" >/dev/null

          aws s3 sync infrastructure/assets/publications "s3://$publication_bucket/" --exclude '*' --include '*.pdf' --sse AES256 --only-show-errors

          current_env=$(aws amplify get-app --app-id "$PUBLIC_APP_ID" --query 'app.environmentVariables' --output json)
          public_build_spec=$(cat infrastructure/amplify/public-site.yml)
          merged_env=$(jq -c \
            --arg ct "$contact_table" --arg cn "$contact_topic" --arg cs "$contact_salt_arn" \
            --arg at "$access_table" --arg as "$access_salt_arn" \
            --arg oa "$OPENAI_SECRET_ARN" --arg pt "$publication_table" --arg pb "$publication_bucket" \
            --arg pe "$PUBLICATION_EMAIL_FROM" --arg ps "$publication_salt_arn" --arg pu "$PUBLIC_SITE_URL" --arg au "$ACCESS_ALLOWED_ORIGINS" \
            --arg va "$VOICE_PROVIDER_ALIAS" --arg rm "$OPENAI_REALTIME_MODEL" --arg re "$OPENAI_REALTIME_ENABLED" --arg lm "$OPENAI_GPT_LIVE_MODEL" \
            '. + {CONTACT_SUBMISSIONS_TABLE:$ct,CONTACT_NOTIFICATION_TOPIC_ARN:$cn,CONTACT_RATE_LIMIT_SALT_SECRET_ARN:$cs,ACCESS_REQUESTS_TABLE:$at,ACCESS_NOTIFICATION_TOPIC_ARN:$cn,ACCESS_RATE_LIMIT_SALT_SECRET_ARN:$as,ACCESS_ALLOWED_ORIGINS:$au,CONTACT_ALLOWED_HOSTS:$au,EVIDENCE_ALLOWED_HOSTS:$au,PUBLICATION_ALLOWED_HOSTS:$au,OPENAI_SECRET_ARN:$oa,PUBLICATION_ACCESS_TABLE:$pt,PUBLICATION_ASSET_BUCKET:$pb,PUBLICATION_EMAIL_FROM:$pe,PUBLICATION_HASH_SALT_SECRET_ARN:$ps,PUBLIC_SITE_URL:$pu,VOICE_PROVIDER_ALIAS:$va,OPENAI_REALTIME_MODEL:$rm,OPENAI_REALTIME_ENABLED:$re,OPENAI_GPT_LIVE_MODEL:$lm}' <<<"$current_env")
          aws amplify update-app \
            --app-id "$PUBLIC_APP_ID" \
            --compute-role-arn "$public_compute_role" \
            --build-spec "$public_build_spec" \
            --environment-variables "$merged_env" >/dev/null

          # Amplify can retain branch-level variables and build definitions
          # independently of app-level settings. Reconcile both layers so the
          # production branch cannot build with stale publication resources.
          branch_env=$(aws amplify get-branch \
            --app-id "$PUBLIC_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --query 'branch.environmentVariables' \
            --output json)
          publication_branch_env=$(jq -c \
            --arg pt "$publication_table" --arg pb "$publication_bucket" \
            --arg pe "$PUBLICATION_EMAIL_FROM" --arg ps "$publication_salt_arn" \
            --arg pu "$PUBLIC_SITE_URL" --arg au "$ACCESS_ALLOWED_ORIGINS" \
            '. + {PUBLICATION_ACCESS_TABLE:$pt,PUBLICATION_ASSET_BUCKET:$pb,PUBLICATION_EMAIL_FROM:$pe,PUBLICATION_HASH_SALT_SECRET_ARN:$ps,PUBLICATION_ALLOWED_HOSTS:$au,PUBLIC_SITE_URL:$pu}' \
            <<<"$branch_env")
          aws amplify update-branch \
            --app-id "$PUBLIC_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --build-spec "$public_build_spec" \
            --environment-variables "$publication_branch_env" >/dev/null

          expected_build_spec_hash=$(printf '%s' "$public_build_spec" | sha256sum | cut -d' ' -f1)
          for attempt in $(seq 1 12); do
            app_build_spec=$(aws amplify get-app --app-id "$PUBLIC_APP_ID" --query 'app.buildSpec' --output text)
            branch_build_spec=$(aws amplify get-branch --app-id "$PUBLIC_APP_ID" --branch-name "$AMPLIFY_BRANCH" --query 'branch.buildSpec' --output text)
            app_build_spec_hash=$(printf '%s' "$app_build_spec" | sha256sum | cut -d' ' -f1)
            branch_build_spec_hash=$(printf '%s' "$branch_build_spec" | sha256sum | cut -d' ' -f1)
            if [[ "$app_build_spec_hash" == "$expected_build_spec_hash" && "$branch_build_spec_hash" == "$expected_build_spec_hash" ]]; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Amplify did not converge on the approved public build specification."
              exit 1
            fi
            sleep 5
          done

          branch_env_after=$(aws amplify get-branch \
            --app-id "$PUBLIC_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --query 'branch.environmentVariables' \
            --output json)
          jq -e \
            --arg pt "$publication_table" --arg pb "$publication_bucket" \
            --arg pe "$PUBLICATION_EMAIL_FROM" --arg ps "$publication_salt_arn" \
            --arg pu "$PUBLIC_SITE_URL" --arg au "$ACCESS_ALLOWED_ORIGINS" \
            '.PUBLICATION_ACCESS_TABLE == $pt and .PUBLICATION_ASSET_BUCKET == $pb and .PUBLICATION_EMAIL_FROM == $pe and .PUBLICATION_HASH_SALT_SECRET_ARN == $ps and .PUBLICATION_ALLOWED_HOSTS == $au and .PUBLIC_SITE_URL == $pu' \
            <<<"$branch_env_after" >/dev/null

          # CB-CAP is intentionally released by deploy-cbcap.yml with its
          # separate least-privilege AWS role and production proof gates.
          release_sha="${RELEASE_SHA:-$(git rev-parse HEAD)}"
          test "$release_sha" = "$(git rev-parse HEAD)"
          origin_main_before=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          test -n "$origin_main_before"
          test "$origin_main_before" = "$release_sha"

          job_id=$(aws amplify start-job --app-id "$PUBLIC_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-type RELEASE --job-reason "Public-site release $release_sha" --query 'jobSummary.jobId' --output text)
          for attempt in $(seq 1 180); do
            job_json=$(aws amplify get-job --app-id "$PUBLIC_APP_ID" --branch-name "$AMPLIFY_BRANCH" --job-id "$job_id" --output json)
            status=$(jq -r '.job.summary.status' <<<"$job_json")
            case "$status" in
              SUCCEED) break ;;
              FAILED|CANCELLED) echo "Public-site Amplify job $job_id ended with $status"; exit 1 ;;
              *) sleep 20 ;;
            esac

            if [[ "$attempt" -eq 180 ]]; then
              echo "Public-site Amplify job $job_id did not finish within 60 minutes."
              exit 1
            fi
          done

          origin_main_after=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          test -n "$origin_main_after"
          if [[ "$origin_main_before" != "$release_sha" || "$origin_main_after" != "$release_sha" ]]; then
            echo "The protected main branch moved during the public-site release."
            exit 1
          fi

          deployed_commit=$(jq -r '.job.summary.commitId // ""' <<<"$job_json")
          if [[ ! "$deployed_commit" =~ ^[0-9a-f]{7,40}$ || "$release_sha" != "$deployed_commit"* ]]; then
            echo "The completed public-site release reports an unexpected source identity."
            exit 1
          fi

          origin="${PUBLIC_SITE_URL%/}"
          if [[ "$origin" != "https://health.sozorockfoundation.org" ]]; then
            echo "Refusing live security checks against an unexpected production origin."
            exit 1
          fi
          publication_slug="health-systems-assurance-volume-1"
          for attempt in $(seq 1 12); do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 "$origin/" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Production origin did not become healthy after release."
              exit 1
            fi
            sleep 10
          done

          headers=$(mktemp)
          curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$headers" --output /dev/null "$origin/"
          grep -Eqi '^strict-transport-security:[[:space:]]*max-age=' "$headers"
          grep -Eqi "^content-security-policy:.*frame-ancestors[[:space:]]+'none'" "$headers"
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$headers"
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' "$headers"

          publication_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "$origin/publications/$publication_slug")
          test "$publication_status" = "200"

          hostile_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://attacker.invalid' \
            --header 'X-Forwarded-Host: attacker.invalid' \
            --header 'Content-Type: application/json' \
            --data "{\"event\":\"publication_viewed\",\"slug\":\"$publication_slug\"}" \
            "$origin/api/publications/events")
          test "$hostile_status" = "403"

          same_origin_headers=$(mktemp)
          same_origin_body=$(mktemp)
          same_origin_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$same_origin_headers" --output "$same_origin_body" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $origin" \
            --header 'Content-Type: application/json' \
            --data "{\"event\":\"publication_viewed\",\"slug\":\"$publication_slug\"}" \
            "$origin/api/publications/events")
          case "$same_origin_status" in
            204)
              test ! -s "$same_origin_body"
              ;;
            429)
              grep -Eqi '^retry-after:[[:space:]]*3600[[:space:]]*$' "$same_origin_headers"
              grep -Eqi '^content-type:[[:space:]]*application/json' "$same_origin_headers"
              jq -e 'type == "object" and .accepted == false and keys == ["accepted"]' "$same_origin_body" >/dev/null
              ;;
            *)
              echo "Canonical publication event returned $same_origin_status; expected 204 or the exact 429 throttle contract."
              exit 1
              ;;
          esac

          access_headers=$(mktemp)
          access_body=$(mktemp)
          access_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$access_headers" --output "$access_body" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $origin" \
            --header 'Content-Type: application/json' \
            --data '{"firstName":"Release","lastName":"Smoke","email":"success@simulator.amazonses.com","organization":"SozoRock Health release check","sector":"Community organization","cityOrRegion":"Albany","state":"New York","country":"United States","reason":"Synthetic production verification for publication access delivery.","deliveryConsent":true,"updatesConsent":false,"website":""}' \
            "$origin/api/publications/access/$publication_slug")
          test "$access_status" = "202"
          jq -e 'type == "object" and .accepted == true and .verificationSent == true and (has("accessGranted") | not) and (has("downloadUrl") | not)' "$access_body" >/dev/null
          grep -Eqi '^cache-control:.*no-store' "$access_headers"
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' "$access_headers"
          if grep -Eqi '^set-cookie:.*__Host-srh_publication_access=' "$access_headers"; then
            echo "Form submission must not issue a publication access cookie before email verification."
            exit 1
          fi

          preverification_download_headers=$(mktemp)
          preverification_download_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$preverification_download_headers" --output /dev/null --write-out '%{http_code}' \
            "$origin/api/publications/download/$publication_slug")
          test "$preverification_download_status" = "303"
          grep -Eqi '^cache-control:.*no-store' "$preverification_download_headers"
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' "$preverification_download_headers"

          verify_headers=$(mktemp)
          verify_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$verify_headers" --output /dev/null --write-out '%{http_code}' \
            "$origin/api/publications/verify")
          test "$verify_status" = "303"
          grep -Eqi '^cache-control:.*no-store' "$verify_headers"
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' "$verify_headers"

          dummy_token=$(printf 'A%.0s' {1..43})
          token_headers=$(mktemp)
          token_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$token_headers" --output /dev/null --write-out '%{http_code}' \
            "$origin/api/publications/verify?token=$dummy_token")
          test "$token_status" = "303"
          token_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^location:[[:space:]]*/, ""); print; exit}' "$token_headers")
          test -n "$token_location"
          case "$token_location" in
            *token=*) echo "Verification token leaked into redirect location."; exit 1 ;;
          esac
          grep -Eqi '^cache-control:.*no-store' "$token_headers"
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' "$token_headers"
          grep -Eqi '^set-cookie:.*__Host-srh_publication_verify=' "$token_headers"
          grep -Eqi '^set-cookie:.*HttpOnly' "$token_headers"
          grep -Eqi '^set-cookie:.*Secure' "$token_headers"
          grep -Eqi '^set-cookie:.*SameSite=Lax' "$token_headers"

          download_headers=$(mktemp)
          download_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$download_headers" --output /dev/null --write-out '%{http_code}' \
            "$origin/api/publications/download/$publication_slug")
          test "$download_status" = "303"
          grep -Eqi '^cache-control:.*no-store' "$download_headers"
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' "$download_headers"

          share_headers=$(mktemp)
          share_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --dump-header "$share_headers" --output /dev/null --write-out '%{http_code}' \
            "$origin/api/evidence/v1/workspace-share?token=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA")
          test "$share_status" = "404"
          grep -Eqi '^cache-control:.*no-store' "$share_headers"
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' "$share_headers"

          voice_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://attacker.invalid' \
            --header 'X-Forwarded-Host: attacker.invalid' \
            --header 'Content-Type: application/sdp' \
            --data 'v=0' \
            "$origin/api/voice/call")
          test "$voice_status" = "403"

          {
            echo "## Production release evidence"
            echo "- Release SHA: $(git rev-parse HEAD)"
            echo "- Amplify release job: $job_id"
            echo "- Production origin: $origin"
            echo "- Publication route: 200"
            echo "- Host/origin spoof rejection: 403"
            echo "- Canonical publication event: $same_origin_status (204 accepted; 429 requires the exact throttle header and body contract)"
            echo "- Publication intelligence index: $publication_intelligence_index_status"
            echo "- Synthetic publication access request: 202 with required verification email and no access session"
            echo "- Pre-verification publication download: 303 rejected"
            echo "- SES verification delivery ready: $ses_delivery_ready"
            echo "- Verification redirect: 303, no-store, no-referrer, verifier in HttpOnly Secure SameSite=Lax cookie"
            echo "- Unauthorized download: 303, no-store, no-referrer"
            echo "- Workspace query capability rejected: 404"
            echo "- Voice hostile-origin request rejected: 403"
            echo "- Security headers: HSTS, CSP frame-ancestors none, nosniff, DENY"
          } >> "$GITHUB_STEP_SUMMARY"
