name: Evidence Gateway planning production proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Explore production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: evidence-gateway-planning-production-proof
  cancel-in-progress: false

jobs:
  prove-planning-extension:
    name: Prove published planning extension
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.action == 'completed' &&
       github.event.workflow_run.name == 'Explore production' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGIN: https://health.sozorockfoundation.org
      EXPECTED_BASE_CONTRACT: sozorock.evidence-gateway.v1
      EXPECTED_PLANNING_CONTRACT: sozorock.evidence-gateway.planning.v1
      EXPECTED_CACHE_CONTROL: public, s-maxage=86400, stale-while-revalidate=604800
      STATUS_CONTEXT: evidence-gateway/planning-production-proof
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_STATUS_TOKEN: ${{ github.token }}
    steps:
      - name: Publish pending planning-proof status
        shell: bash
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -cn \
            --arg state pending \
            --arg target_url "$target_url" \
            --arg description "Five-county planning Evidence Gateway proof is running" \
            --arg context "$STATUS_CONTEXT" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_STATUS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null

      - name: Prove planning contract, lineage, locators, and cache identity
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          counties=(36001 36093 36057 42029 48029)
          proof_file=$(mktemp)

          for geoid in "${counties[@]}"; do
            headers=$(mktemp)
            body=$(mktemp)

            status=$(curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 6 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 30 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$ORIGIN/api/evidence/v1/gateway?geoid=$geoid")
            test "$status" = "200"

            cache_control=$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/\r$/, ""); sub(/^cache-control:[[:space:]]*/, ""); print; exit}' "$headers")
            base_contract=$(awk 'BEGIN{IGNORECASE=1} /^x-evidence-contract:/ {sub(/\r$/, ""); sub(/^x-evidence-contract:[[:space:]]*/, ""); print; exit}' "$headers")
            planning_contract=$(awk 'BEGIN{IGNORECASE=1} /^x-evidence-planning-contract:/ {sub(/\r$/, ""); sub(/^x-evidence-planning-contract:[[:space:]]*/, ""); print; exit}' "$headers")
            release_hash=$(awk 'BEGIN{IGNORECASE=1} /^x-evidence-release-hash:/ {sub(/\r$/, ""); sub(/^x-evidence-release-hash:[[:space:]]*/, ""); print; exit}' "$headers")
            etag=$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/\r$/, ""); sub(/^etag:[[:space:]]*/, ""); print; exit}' "$headers")

            test "$cache_control" = "$EXPECTED_CACHE_CONTROL"
            test "$base_contract" = "$EXPECTED_BASE_CONTRACT"
            test "$planning_contract" = "$EXPECTED_PLANNING_CONTRACT"
            [[ "$release_hash" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$etag" = "\"$release_hash\""

            jq -e \
              --arg base_contract "$EXPECTED_BASE_CONTRACT" \
              --arg planning_contract "$EXPECTED_PLANNING_CONTRACT" \
              --arg geoid "$geoid" '
                .manifest.contract_version == $base_contract and
                .package.contract_version == $base_contract and
                .package.planning_contract_version == $planning_contract and
                (.package.planning_documents | type) == "array" and
                (.package.planning_claims | type) == "array" and
                (.package.planning_citations | type) == "array" and
                ([.package.planning_documents[] |
                  (.coverage_scope == "county_specific") and
                  (.review_status == "verified") and
                  (.geography_ids | length == 1) and
                  (.geography_ids[0] | endswith($geoid)) and
                  (.source_version_id | type == "string") and
                  (.reviewed_by | type == "string") and
                  (.reviewed_at | type == "string")
                ] | all) and
                ([.package.planning_claims[] as $claim |
                  ($claim.review_status == "verified") and
                  ($claim.geography_ids | length == 1) and
                  ($claim.geography_ids[0] | endswith($geoid)) and
                  ([.package.planning_documents[] | select(.id == $claim.document_id)] | length == 1)
                ] | all) and
                ([.package.planning_citations[] as $citation |
                  ($citation.review_status == "verified") and
                  (($citation.page_number != null and $citation.page_number > 0) or
                   ($citation.section != null and ($citation.section | length) > 0)) and
                  ([.package.planning_claims[] |
                    select(.id == $citation.claim_id and .document_id == $citation.document_id)] | length == 1) and
                  ([.package.planning_documents[] |
                    select(.id == $citation.document_id and .source_version_id == $citation.source_version_id)] | length == 1)
                ] | all)
              ' "$body" >/dev/null

            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$geoid" \
              "$(jq -r '.package.planning_documents | length' "$body")" \
              "$(jq -r '.package.planning_claims | length' "$body")" \
              "$(jq -r '.package.planning_citations | length' "$body")" \
              "$release_hash" >> "$proof_file"
          done

          {
            echo "## Planning Evidence Gateway production proof"
            echo "- Base contract: $EXPECTED_BASE_CONTRACT"
            echo "- Planning contract: $EXPECTED_PLANNING_CONTRACT"
            echo "- County responses: 5/5"
            echo "- Every admitted document is verified and exact-county"
            echo "- Every admitted claim joins to one admitted document"
            echo "- Every admitted citation has a page or section locator and preserves claim/document/source lineage"
            echo "- Empty planning arrays remain valid evidence-record gaps rather than inferred plan omissions"
            echo ""
            echo "| County GEOID | Documents | Claims | Citations | Package hash |"
            echo "| --- | ---: | ---: | ---: | --- |"
            while IFS=$'\t' read -r geoid documents claims citations package_hash; do
              echo "| $geoid | $documents | $claims | $citations | $package_hash |"
            done < "$proof_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish final planning-proof status
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$PROOF_OUTCOME" == "success" ]]; then
            state=success
            description="Five-county planning Evidence Gateway production proof passed"
          else
            state=failure
            description="Five-county planning Evidence Gateway production proof failed"
          fi
          payload=$(jq -cn \
            --arg state "$state" \
            --arg target_url "$target_url" \
            --arg description "$description" \
            --arg context "$STATUS_CONTEXT" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_STATUS_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null

      - name: Fail workflow when planning production proof fails
        if: steps.proof.outcome != 'success'
        shell: bash
        run: exit 1
