name: Place evidence operations review

on:
  schedule:
    - cron: "17 7 * * 1"
    - cron: "43 8 1 * *"
  workflow_dispatch:

concurrency:
  group: place-evidence-operations-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  source-health:
    name: Check national source health without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Use the supported Node.js release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Run evidence policy and safety tests
        run: npm run test --workspace @sozorock/evidence-core

      - name: Run the clean-install runtime security gate
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=moderate
          npm run verify:public-runtime-security
          echo "SECURITY_GATE_PASSED=true" >> "$GITHUB_ENV"

      - name: Record official-source health and national coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/place-evidence-operations
          npm run evaluate:five-places --workspace @sozorock/evidence-core -- --include-hrsa \
            | tee output/place-evidence-operations/five-place-source-health.json
          npm run build:national-coverage --workspace @sozorock/evidence-core
          cp packages/evidence-core/data/national/national-coverage-report.v1.json \
            output/place-evidence-operations/national-coverage.json

      - name: Record release-gate status
        shell: bash
        run: |
          set -euo pipefail
          npm run evaluate:national-operations --workspace @sozorock/evidence-core \
            | tee output/place-evidence-operations/release-gates.json

      - name: Upload internal review evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: place-evidence-source-health-${{ github.run_id }}
          path: output/place-evidence-operations
          retention-days: 30

  monthly-planning-review:
    name: Rebuild the controlled planning review queue
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 8 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Use the supported Node.js release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Rebuild deterministic review artifacts
        run: npm run build:planning-review --workspace @sozorock/evidence-core

      - name: Verify no unreviewed source drift
        run: git diff --exit-code

      - name: Upload the internal review queue
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: planning-review-queue-${{ github.run_id }}
          path: packages/evidence-core/review/milestone-3-pilot-evidence-review.json
          retention-days: 30

  monthly-adapter-candidates:
    name: Validate official candidate releases without publishing
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 8 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      - name: Download and validate official candidates
        shell: bash
        run: |
          set -euo pipefail
          npm run build:national-acs-context --workspace @sozorock/evidence-core
          npm run build:national-hrsa-context --workspace @sozorock/evidence-core
          npm run build:national-ahrf-context --workspace @sozorock/evidence-core
          npm run build:national-ahrq-context --workspace @sozorock/evidence-core
          npm run build:national-coverage --workspace @sozorock/evidence-core
          npm run test --workspace @sozorock/evidence-core
      - name: Propose human review when approved artifacts would change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No candidate release changed the approved artifact set."
            exit 0
          fi
          mkdir -p output/place-evidence-operations
          git diff --stat > output/place-evidence-operations/candidate-change-stat.txt
          title="[Evidence adapter review] candidate source changes $(date -u +%Y-%m)"
          if ! gh issue list --state open --search "\"$title\" in:title" --json title \
            --jq '.[].title' | grep -Fxq "$title"; then
            {
              echo "Official candidate releases produced changes in the controlled evidence artifacts."
              echo
              echo "No production mapping or evidence snapshot was changed."
              echo "A named reviewer must inspect source meaning, schema, geography, coverage, and measures."
              echo
              echo '```'
              cat output/place-evidence-operations/candidate-change-stat.txt
              echo '```'
            } > output/place-evidence-operations/candidate-review.md
            gh issue create --title "$title" --body-file output/place-evidence-operations/candidate-review.md
          fi
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: source-adapter-candidates-${{ github.run_id }}
          path: output/place-evidence-operations
          retention-days: 30
