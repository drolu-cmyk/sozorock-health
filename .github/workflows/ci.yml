name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: evidence_test
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: evidence_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidence -d evidence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EVIDENCE_DATABASE_URL: postgresql://evidence:evidence_test_only@localhost:5432/evidence_test
      EVIDENCE_DATABASE_SSL: disable
      EVIDENCE_MIGRATION_TEST_DISPOSABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject sensitive tracked files
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | awk '
            BEGIN { IGNORECASE=1 }
            /(^|\/)\.env($|\.)/ && $0 !~ /(^|\/)\.env\.example$/ { print; next }
            /(^|\/)(id_rsa)(\.|$)/ { print; next }
            /\.(pem|key|p8|p12|pfx|keystore|mobileprovision)$/ { print; next }
            /(^|\/)\.npmrc$/ { print; next }
            /(^|\/)credentials\.json$/ { print; next }
            /(^|\/)service-account[^\/]*\.json$/ { print; next }
          ')
          if [[ -n "$bad_files" ]]; then
            echo "Sensitive credential-like files must not be tracked:"
            printf '%s\n' "$bad_files"
            exit 1
          fi
      - name: Verify workflow trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo "pull_request_target is not permitted in repository workflows."
            exit 1
          fi
          if grep -RInE '^[[:space:]]*permissions:[[:space:]]*write-all([[:space:]]|$)' .github/workflows; then
            echo "write-all workflow permissions are not permitted."
            exit 1
          fi
          if grep -RInE 'curl[^|]*\|[[:space:]]*(bash|sh)([[:space:]]|$)' .github/workflows; then
            echo "Piped remote shell execution is not permitted."
            exit 1
          fi
          while IFS= read -r action; do
            [[ -z "$action" ]] && continue
            case "$action" in
              ./*|docker://*) continue ;;
            esac
            ref="${action##*@}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Workflow action is not pinned to a full commit SHA: $action"
              exit 1
            fi
          done < <(
            sed -nE 's/^[[:space:]-]*uses:[[:space:]]*([^[:space:]#]+).*/\1/p' .github/workflows/*.yml
          )
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      - name: Detect mobile application changes
        id: mobile-scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$head" -- apps/mobile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:migrations --workspace @sozorock/evidence-core
      - name: Reject publicly served publication PDFs
        run: |
          if find apps/public-site/public/publications -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "Publication PDFs must be delivered from the private publication bucket."
            exit 1
          fi
      - run: npm run build:public
      - run: npm run verify:public-runtime-security
      - run: npm run build:platform
      - name: Generate public runtime SBOM
        run: |
          set -euo pipefail
          mkdir -p output/security
          npm sbom --workspace @sozorock/public-site --omit=dev --omit=optional \
            --sbom-format cyclonedx > output/security/public-runtime.cdx.json
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true
      - name: Scan tracked repository for secrets
        run: |
          set -euo pipefail
          trivy fs --scanners secret --exit-code 1 \
            --skip-dirs node_modules \
            --skip-dirs .git \
            --skip-dirs apps/public-site/.next \
            --skip-dirs output \
            .
      - name: Scan public runtime SBOM
        run: |
          set -euo pipefail
          trivy sbom --severity HIGH,CRITICAL --exit-code 1 \
            output/security/public-runtime.cdx.json
      - name: Upload public release security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-security-${{ github.sha }}
          path: |
            output/security/public-runtime.cdx.json
            output/security/public-runtime-security.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate Expo mobile configuration
        if: steps.mobile-scope.outputs.changed == 'true'
        run: npm exec --workspace @sozorock/mobile -- expo-doctor
      - name: Export Android application
        if: steps.mobile-scope.outputs.changed == 'true'
        run: npm exec --workspace @sozorock/mobile -- expo export --platform android --output-dir dist/ci-android
      - name: Export iOS application
        if: steps.mobile-scope.outputs.changed == 'true'
        run: npm exec --workspace @sozorock/mobile -- expo export --platform ios --output-dir dist/ci-ios
      - run: npm audit --omit=dev --omit=optional --audit-level=moderate
      - name: Record verification evidence
        run: |
          {
            echo "## Verification evidence"
            echo "- Commit: $GITHUB_SHA"
            echo "- Sensitive tracked-file guard: passed"
            echo "- Workflow trust-boundary guard: passed"
            echo "- Repository secret scan: passed"
            echo "- Typecheck, lint, unit tests, public build, platform build: passed"
            echo "- Public runtime security manifest: generated"
            echo "- CycloneDX runtime SBOM: generated"
            echo "- Trivy HIGH/CRITICAL SBOM scan: passed"
            echo "- npm production audit at moderate threshold: passed"
          } >> "$GITHUB_STEP_SUMMARY"
