name: Evidence Gateway production activation

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: evidence-gateway-production-activation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  activate:
    name: Dispatch governed Evidence production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      ACTIVATION_STATUS_CONTEXT: evidence-gateway/production-activation
      PROOF_STATUS_CONTEXT: evidence-gateway/production-proof
      GH_API_TOKEN: ${{ github.token }}
      EXPLORE_WORKFLOW: explore-production.yml
    steps:
      - name: Publish pending activation status
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -cn \
            --arg state pending \
            --arg target_url "$target_url" \
            --arg description "Governed Evidence production release is being activated" \
            --arg context "$ACTIVATION_STATUS_CONTEXT" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null

      - name: Dispatch exact governed Explore production release
        id: dispatch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          main_sha=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')
          test "$main_sha" = "$TARGET_SHA"

          payload=$(jq -cn \
            --arg ref main \
            --arg release_sha "$TARGET_SHA" \
            '{ref:$ref,inputs:{release_sha:$release_sha}}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPLORE_WORKFLOW/dispatches"

      - name: Publish activation failure when dispatch is blocked
        if: steps.dispatch.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for context in "$ACTIVATION_STATUS_CONTEXT" "$PROOF_STATUS_CONTEXT"; do
            if [[ "$context" == "$ACTIVATION_STATUS_CONTEXT" ]]; then
              description="Governed Evidence production activation failed"
            else
              description="Production proof blocked because governed activation failed"
            fi
            payload=$(jq -cn \
              --arg state failure \
              --arg target_url "$target_url" \
              --arg description "$description" \
              --arg context "$context" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_API_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null
          done

      - name: Fail activation when governed dispatch fails
        if: steps.dispatch.outcome != 'success'
        shell: bash
        run: exit 1
