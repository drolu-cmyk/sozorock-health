name: Evidence Gateway production activation

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: evidence-gateway-production-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Dispatch and verify governed Evidence production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      STATUS_CONTEXT: evidence-gateway/production-activation
      GH_API_TOKEN: ${{ github.token }}
      EXPLORE_WORKFLOW: explore-production.yml
    steps:
      - name: Require an exact deployed main commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')
          test "$main_sha" = "$TARGET_SHA"

      - name: Publish pending activation status
        shell: bash
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -cn \
            --arg state pending \
            --arg target_url "$target_url" \
            --arg description "Governed Evidence production release is running" \
            --arg context "$STATUS_CONTEXT" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null

      - name: Dispatch exact governed Explore production release
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatch_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "dispatch_started=$dispatch_started" >> "$GITHUB_OUTPUT"
          payload=$(jq -cn \
            --arg ref main \
            --arg release_sha "$TARGET_SHA" \
            '{ref:$ref,inputs:{release_sha:$release_sha}}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPLORE_WORKFLOW/dispatches"

      - name: Locate and wait for the governed production run
        id: governed_release
        continue-on-error: true
        env:
          DISPATCH_STARTED: ${{ steps.dispatch.outputs.dispatch_started }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 40); do
            runs=$(curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer $GH_API_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPLORE_WORKFLOW/runs?branch=main&event=workflow_dispatch&per_page=20")
            run_id=$(jq -r \
              --arg sha "$TARGET_SHA" \
              --arg started "$DISPATCH_STARTED" '
                [.workflow_runs[]
                  | select(.head_sha == $sha and .created_at >= $started)]
                | sort_by(.created_at)
                | last
                | .id // empty
              ' <<<"$runs")
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 440); do
            run=$(curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer $GH_API_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            case "$status" in
              completed)
                test "$conclusion" = "success"
                exit 0
                ;;
              queued|in_progress|waiting|pending|requested)
                sleep 15
                ;;
              *)
                echo "Unexpected governed release status: $status" >&2
                exit 1
                ;;
            esac
          done
          echo "Governed Evidence production run exceeded the activation timeout." >&2
          exit 1

      - name: Publish final activation status
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.governed_release.outcome }}
          RELEASE_RUN_ID: ${{ steps.governed_release.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_OUTCOME" == "success" ]]; then
            state=success
            description="Governed Evidence production release passed"
          else
            state=failure
            description="Governed Evidence production release failed"
          fi
          if [[ -n "$RELEASE_RUN_ID" ]]; then
            target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID"
          else
            target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          payload=$(jq -cn \
            --arg state "$state" \
            --arg target_url "$target_url" \
            --arg description "$description" \
            --arg context "$STATUS_CONTEXT" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null

      - name: Fail activation when governed production fails
        if: steps.governed_release.outcome != 'success'
        shell: bash
        run: exit 1
