name: Queue Explore production release

on:
  push:
    branches: [main]
    paths:
      - "release/explore-production.request"

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: queue-explore-production-release
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch and verify the protected Explore production workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch exact main commit and prove a run exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          DISPATCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          publish_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"
            local status_payload
            status_payload=$(jq -cn \
              --arg state "$state" \
              --arg target_url "$target_url" \
              --arg description "$description" \
              --arg context 'explore-production/dispatch' \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$RELEASE_SHA" \
              --data "$status_payload" >/dev/null
          }

          on_error() {
            local code=$?
            set +e
            publish_status failure 'Explore production dispatch failed closed' "$DISPATCH_RUN_URL"
            exit "$code"
          }
          trap on_error ERR

          publish_status pending 'Waiting for exact Explore production workflow run' "$DISPATCH_RUN_URL"

          payload=$(jq -cn \
            --arg ref "main" \
            --arg release_sha "$RELEASE_SHA" \
            '{ref:$ref, inputs:{release_sha:$release_sha}}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/explore-production.yml/dispatches" \
            --data "$payload" >/dev/null

          run_url=''
          for attempt in $(seq 1 60); do
            runs=$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/explore-production.yml/runs?event=workflow_dispatch&branch=main&per_page=20")
            run_url=$(jq -r --arg sha "$RELEASE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch")]
              | sort_by(.created_at) | reverse | .[0].html_url // ""
            ' <<<"$runs")
            if [[ -n "$run_url" ]]; then break; fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "Explore production dispatch returned but no exact-SHA workflow run appeared."
              exit 1
            fi
            sleep 5
          done

          publish_status success 'Exact Explore production workflow run created' "$run_url"
          trap - ERR
          echo "Explore production run exists for exact main commit $RELEASE_SHA: $run_url"
