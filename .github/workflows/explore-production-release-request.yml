name: Queue Explore production release

on:
  push:
    branches: [main]
    paths:
      - "release/explore-production.request"

permissions:
  contents: read
  actions: write

concurrency:
  group: queue-explore-production-release
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch the protected Explore production workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          payload=$(jq -cn \
            --arg ref "main" \
            --arg release_sha "$RELEASE_SHA" \
            '{ref:$ref, inputs:{release_sha:$release_sha}}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/explore-production.yml/dispatches" \
            --data "$payload"

          echo "Queued Explore production for exact main commit $RELEASE_SHA."
