name: Refresh Expo lock (temporary)
on:
  push:
    branches: [maint/refresh-expo-lock]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Update Expo to the SDK's current patch
        run: |
          set -euo pipefail
          npm install expo@~57.0.31 --workspace @sozorock/mobile --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --stat
          node -e "const l=require('./package-lock.json').packages;for(const k of Object.keys(l))if(/node_modules\/(expo|@expo\/cli|xcode|zod|expo-modules-core|@expo\/config-plugins)$/.test(k))console.log(k,l[k].version)"
      - name: Commit the refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/mobile/package.json
          git commit -m "Refresh Expo lock" || echo "nothing to commit"
          git push
