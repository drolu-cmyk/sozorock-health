name: Reconcile AI Lab AWS trust

on:
  push:
    branches: [main]
    paths:
      - infrastructure/iam/sozorock-ai-lab-github-trust.json
      - .github/workflows/reconcile-ai-lab-trust.yml
      - scripts/repair-ai-lab-aws-trust.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-lab-trust-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.repository == 'drolu-cmyk/sozorock-health' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate exact repair configuration
        env:
          TRUST_REPAIR_ROLE_ARN: ${{ vars.AI_LAB_TRUST_REPAIR_ROLE_ARN }}
          AI_LAB_DEPLOY_ROLE_NAME: ${{ vars.AI_LAB_DEPLOY_ROLE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRUST_REPAIR_ROLE_ARN"
          test -n "$AI_LAB_DEPLOY_ROLE_NAME"
          test "$AI_LAB_DEPLOY_ROLE_NAME" = 'GitHubActionsSozorockAiLabDeployRole'
          jq -e '.Version == "2012-10-17" and (.Statement | length) == 1' infrastructure/iam/sozorock-ai-lab-github-trust.json >/dev/null
          jq -e '.Statement[0].Action == "sts:AssumeRoleWithWebIdentity"' infrastructure/iam/sozorock-ai-lab-github-trust.json >/dev/null
          jq -e '.Statement[0].Principal.Federated == "arn:aws:iam::791860731989:oidc-provider/token.actions.githubusercontent.com"' infrastructure/iam/sozorock-ai-lab-github-trust.json >/dev/null
          actual="$(jq -c '.Statement[0].Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort' infrastructure/iam/sozorock-ai-lab-github-trust.json)"
          expected='["repo:drolu-cmyk/sozorock-ai-lab:environment:production","repo:drolu-cmyk/sozorock-ai-lab:ref:refs/heads/main","repo:drolu-cmyk/sozorock-foundation:ref:refs/heads/main"]'
          test "$actual" = "$expected"

      - name: Assume dedicated trust-repair role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AI_LAB_TRUST_REPAIR_ROLE_ARN }}
          role-session-name: ai-lab-trust-reconcile-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          retry-max-attempts: 3

      - name: Apply reviewed trust document
        env:
          AI_LAB_DEPLOY_ROLE_NAME: ${{ vars.AI_LAB_DEPLOY_ROLE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '791860731989'
          role_name="$AI_LAB_DEPLOY_ROLE_NAME"
          test "$role_name" = 'GitHubActionsSozorockAiLabDeployRole'
          aws iam get-role --role-name "$role_name" >/dev/null
          aws iam update-assume-role-policy \
            --role-name "$role_name" \
            --policy-document file://infrastructure/iam/sozorock-ai-lab-github-trust.json

          expected="$(jq -c '.Statement[0].Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort' infrastructure/iam/sozorock-ai-lab-github-trust.json)"
          actual="$(aws iam get-role --role-name "$role_name" --output json | jq -c '.Role.AssumeRolePolicyDocument.Statement[] | select(.Action == "sts:AssumeRoleWithWebIdentity") | .Condition.StringLike["token.actions.githubusercontent.com:sub"] | sort')"
          test "$actual" = "$expected"
          echo "Trust policy reconciled for ${role_name}." >> "$GITHUB_STEP_SUMMARY"
