    "/api/evidence/v1/workspaces/{workspaceId}/artifacts": {
      "parameters": [
        {
          "name": "workspaceId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "post": {
        "tags": [
          "Workspace"
        ],
        "summary": "Create an idempotent comment or review question, complete a review question, or review an agent suggestion.",
        "security": [
          {
            "cognitoAccessToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "type": "object",
                    "required": [
                      "action",
                      "sectionKey",
                      "body"
                    ],
                    "properties": {
                      "action": {
                        "const": "comment"
                      },
                      "sectionKey": {
                        "type": "string",
                        "pattern": "^[a-z][a-z0-9_-]{1,63}$"
                      },
                      "body": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 4000
                      }
                    }
                  },
                  {
                    "type": "object",
                    "required": [
                      "action",
                      "sectionKey",
                      "question"
                    ],
                    "properties": {
                      "action": {
                        "const": "review_question"
                      },
                      "sectionKey": {
                        "type": "string",
                        "pattern": "^[a-z][a-z0-9_-]{1,63}$"
                      },
                      "question": {
                        "type": "string",
                        "minLength": 3,
                        "maxLength": 2000
                      },
                      "assignedTo": {
                        "type": [
                          "string",
                          "null"
                        ]
                      },
                      "isPublic": {
                        "type": "boolean"
                      }
                    }
                  },
                  {
                    "type": "object",
                    "required": [
                      "action",
                      "reviewQuestionId",
                      "status"
                    ],
                    "properties": {
                      "action": {
                        "const": "complete_review_question"
                      },
                      "reviewQuestionId": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "status": {
                        "type": "string",
                        "enum": [
                          "answered",
                          "closed"
                        ]
                      }
                    }
                  },
                  {
                    "type": "object",
                    "required": [
                      "action",
                      "suggestionId",
                      "decision",
                      "expectedSectionVersion"
                    ],
                    "properties": {
                      "action": {
                        "const": "review_suggestion"
                      },
                      "suggestionId": {
                        "type": "string",
                        "format": "uuid"
                      },
                      "decision": {
                        "type": "string",
                        "enum": [
                          "accepted",
                          "rejected"
                        ]
                      },
                      "expectedSectionVersion": {
                        "type": "integer",
                        "minimum": 0
                      }
                    }
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "Request rejected or evidence unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Request rejected or evidence unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Request rejected or evidence unavailable.",
            "content": {
