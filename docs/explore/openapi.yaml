  "components": {
    "securitySchemes": {
      "cognitoAccessToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Cognito access token"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "CountySetRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "geoids"
        ],
        "properties": {
          "geoids": {
            "type": "array",
            "minItems": 1,
            "maxItems": 25,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[0-9]{5}$",
              "description": "Current Census county or county-equivalent GEOID."
            }
          },
          "measureDefinitionId": {
            "type": [
              "string",
              "null"
            ]
          },
          "format": {
            "type": "string",
            "enum": [
              "json",
              "html"
            ],
            "default": "json"
          },
          "assumptions": {
            "type": "object"
          }
        }
      },
      "HeatMapCountySetRequest": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "geoids",
              "comparisonGroup"
            ],
            "properties": {
              "geoids": {
                "type": "array",
                "minItems": 1,
                "maxItems": 1,
                "uniqueItems": true,
                "items": {
                  "type": "string",
                  "pattern": "^[0-9]{5}$",
                  "description": "Current Census county or county-equivalent GEOID."
                }
              },
              "comparisonGroup": {
                "const": "nearby",
                "description": "Return the selected county and nearby same-state counties by wrapped, latitude-adjusted internal-point distance. This supplies geographic context, not a peer ranking."
              },
              "measureDefinitionId": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "geoids"
            ],
            "properties": {
              "geoids": {
                "type": "array",
                "minItems": 2,
                "maxItems": 25,
                "uniqueItems": true,
                "items": {
                  "type": "string",
                  "pattern": "^[0-9]{5}$",
                  "description": "Current Census county or county-equivalent GEOID."
                }
              },
              "measureDefinitionId": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          }
        ]
      },
      "AgentRequest": {
        "type": "object",
        "required": [
          "geoid",
          "question"
        ],
        "properties": {
          "geoid": {
            "type": "string",
            "pattern": "^[0-9]{5}$",
            "description": "Current Census county or county-equivalent GEOID."
          },
          "question": {
            "type": "string",
            "minLength": 3,
            "maxLength": 1500
          },
          "inputMode": {
            "type": "string",
            "enum": [
              "typed",
              "voice"
            ]
          },
          "transcriptHash": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        }
      },
      "AgentAnswer": {
        "type": "object",
        "required": [
          "schemaVersion",
          "answer",
          "status",
          "citedEvidence",
          "visualIntent",
          "nonClinicalBoundary"
        ],
        "properties": {
          "schemaVersion": {
            "type": "string"
          },
          "answer": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "answered",
              "evidence_gap",
              "refused"
            ]
          },
          "citedEvidence": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "visualIntent": {
            "type": "object"
          },
          "nonClinicalBoundary": {
            "type": "string"
          }
        }
      }
    }
  },
  "x-sozorock": {
    "contractVersion": "explore.api.v2",
    "cache": "Public evidence is pinned by contract, policy and evidence snapshot. Authenticated/share responses are no-store.",
    "audit": "Consequential agent, workspace, scenario, share and funder actions are append-only audited.",
    "constraints": "No PHI, diagnosis, triage, treatment, individual-risk inference or unrestricted live-web evidence.",
    "deprecation": "The legacy geography query alias remains accepted only where documented and returns a deprecation header.",
    "rateLimits": "Public evidence, agent, voice and export routes apply server-side network/session limits."
  }
